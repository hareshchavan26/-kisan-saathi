version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kisan_saathi_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kisan_saathi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisan_saathi_backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/kisan_saathi
      - PORT=3001
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:5173
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: kisan_saathi_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    depends_on:
      - backend

volumes:
  pgdata:
